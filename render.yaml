# One-click deploy on Render (https://render.com): New > Blueprint > pick this repo.
services:
  - type: web
    name: clearance-tracker
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    # Paid plans only: keeps the price history database across deploys.
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_PATH
        value: /var/data/clearance-tracker.db
      # Leave these unset to run on demo data; set them to go live.
      - key: WALMART_CONSUMER_ID
        sync: false
      - key: WALMART_PRIVATE_KEY
        sync: false
      - key: WALMART_KEY_VERSION
        value: "1"
